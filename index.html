<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Zahra ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:'Montserrat',sans-serif;
    background:#160f14;
    color:#fff;
}

/* =========================
   BACKGROUND
========================= */

.scene{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(207,146,166,.16),
            transparent 32%
        ),
        linear-gradient(
            145deg,
            #130d12,
            #25151e 55%,
            #120c11
        );
}

.glow{
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.25;
    background:#c8869d;
    animation:floatGlow 10s infinite alternate ease-in-out;
}

.glow.one{
    left:-180px;
    top:-180px;
}

.glow.two{
    right:-200px;
    bottom:-200px;
    animation-delay:3s;
}

@keyframes floatGlow{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(90px,50px);
    }
}

/* =========================
   STARS
========================= */

.stars{
    position:absolute;
    inset:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    opacity:.3;
    animation:twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{
    0%,100%{
        opacity:.15;
        transform:scale(.6);
    }

    50%{
        opacity:1;
        transform:scale(1.6);
    }
}

/* =========================
   MOON
========================= */

.moon{
    position:absolute;
    width:110px;
    height:110px;
    border-radius:50%;
    top:8%;
    right:12%;
    background:#fff3ee;
    box-shadow:
        0 0 25px rgba(255,235,230,.3),
        0 0 90px rgba(219,150,170,.15);
}

.moon:after{
    content:"";
    position:absolute;
    width:103px;
    height:103px;
    border-radius:50%;
    background:#1b1117;
    left:22px;
    top:-10px;
}

/* =========================
   INTRO
========================= */

.intro{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#130d12;
    transition:1.3s cubic-bezier(.77,0,.18,1);
}

.intro.hide{
    transform:translateY(-100%);
}

.intro-small{
    font-size:9px;
    letter-spacing:5px;
    color:#b98a99;
    text-transform:uppercase;
    margin-bottom:15px;
}

.intro h1{
    font-family:'Cormorant Garamond',serif;
    font-size:64px;
    font-weight:500;
}

.intro p{
    color:#907b83;
    font-size:10px;
    margin-top:5px;
}

.open{
    margin-top:35px;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.04);
    color:#fff;
    padding:14px 30px;
    border-radius:50px;
    font-size:10px;
    letter-spacing:1px;
    cursor:pointer;
    transition:.35s;
}

.open:hover{
    background:rgba(255,255,255,.1);
    transform:translateY(-3px);
}

/* =========================
   MAIN
========================= */

.main{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:min(450px,100%);
    position:relative;
    text-align:center;
    padding:48px 35px;
    border-radius:32px;
    border:1px solid rgba(255,220,225,.12);
    background:rgba(255,255,255,.055);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    box-shadow:
        0 30px 100px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.08);
    animation:cardIn 1.5s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(35px) scale(.94);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.eyebrow{
    font-size:9px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#c497a5;
}

.title{
    font-family:'Cormorant Garamond',serif;
    font-size:62px;
    line-height:.85;
    margin-top:13px;
    font-weight:600;
}

.title span{
    color:#dfaaba;
}

.line{
    width:45px;
    height:1px;
    background:#bd8798;
    margin:25px auto;
    opacity:.7;
}

.message{
    color:#d8c8cc;
    font-size:12px;
    line-height:2;
    min-height:82px;
}

.cursor{
    display:inline-block;
    height:13px;
    width:1px;
    background:#dbaaba;
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{opacity:0}
}

/* =========================
   BUTTON
========================= */

.buttons{
    margin-top:28px;
    display:flex;
    justify-content:center;
    gap:10px;
}

.btn{
    border:none;
    padding:12px 20px;
    border-radius:30px;
    font-family:'Montserrat',sans-serif;
    font-size:9px;
    cursor:pointer;
    transition:.35s;
}

.sleep{
    background:#d7a1b1;
    color:#211219;
}

.sleep:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 30px rgba(215,161,177,.25);
}

.no{
    background:rgba(255,255,255,.05);
    color:#c9b8bd;
    border:1px solid rgba(255,255,255,.1);
}

/* =========================
   LETTER
========================= */

.letter{
    margin-top:25px;
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:1s ease;
}

.letter.opened{
    max-height:180px;
    opacity:1;
}

.letter p{
    font-family:'Cormorant Garamond',serif;
    color:#e8c7cf;
    font-size:22px;
    line-height:1.25;
}

.letter small{
    display:block;
    color:#8e7a82;
    font-size:9px;
    margin-top:8px;
}

/* =========================
   ENDING
========================= */

.ending{
    position:fixed;
    inset:0;
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    background:
        radial-gradient(
            circle,
            rgba(214,151,172,.18),
            transparent 35%
        ),
        #160e13;
    opacity:0;
    pointer-events:none;
    transition:1.2s ease;
}

.ending.show{
    opacity:1;
    pointer-events:auto;
}

.ending .small{
    font-size:9px;
    letter-spacing:5px;
    color:#b88c9a;
    text-transform:uppercase;
}

.ending h2{
    font-family:'Cormorant Garamond',serif;
    font-size:68px;
    font-weight:500;
    margin-top:15px;
}

.ending p{
    color:#a89198;
    font-size:11px;
    margin-top:10px;
}

.close{
    margin-top:30px;
    padding:11px 22px;
    border-radius:30px;
    border:1px solid rgba(255,255,255,.15);
    background:transparent;
    color:#bdaab0;
    font-size:9px;
    cursor:pointer;
}

/* =========================
   PETALS
========================= */

.petal{
    position:fixed;
    top:-20px;
    width:8px;
    height:5px;
    border-radius:100% 0 100% 0;
    background:#d49aaa;
    opacity:.4;
    pointer-events:none;
    z-index:5;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:
            translateY(110vh)
            translateX(100px)
            rotate(400deg);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .moon{
        width:70px;
        height:70px;
        right:7%;
        top:7%;
    }

    .moon:after{
        width:65px;
        height:65px;
        left:14px;
        top:-7px;
    }

    .card{
        padding:40px 25px;
    }

    .title{
        font-size:52px;
    }

    .intro h1{
        font-size:50px;
    }

    .ending h2{
        font-size:54px;
    }
}

</style>
</head>

<body>

<!-- =========================
     BACKGROUND
========================= -->

<div class="scene">

    <div class="glow one"></div>
    <div class="glow two"></div>

    <div class="moon"></div>

    <div class="stars">

        <i class="star" style="top:12%;left:13%;animation-delay:.2s"></i>
        <i class="star" style="top:20%;left:29%;animation-delay:1s"></i>
        <i class="star" style="top:31%;left:70%;animation-delay:2s"></i>
        <i class="star" style="top:17%;left:78%;animation-delay:.5s"></i>
        <i class="star" style="top:47%;left:12%;animation-delay:1.5s"></i>
        <i class="star" style="top:65%;left:85%;animation-delay:.7s"></i>
        <i class="star" style="top:80%;left:25%;animation-delay:1.8s"></i>
        <i class="star" style="top:72%;left:63%;animation-delay:1.1s"></i>
        <i class="star" style="top:55%;left:45%;animation-delay:2.4s"></i>

    </div>

</div>

<!-- =========================
     INTRO
========================= -->

<div class="intro" id="intro">

    <div class="intro-small">
        a tiny night message
    </div>

    <h1>For Zahra ♡</h1>

    <p>tap to enter</p>

    <button class="open" onclick="enter()">
        OPEN THE NIGHT
    </button>

</div>

<!-- =========================
     MAIN CARD
========================= -->

<main class="main">

    <section class="card">

        <div class="eyebrow">
            september • 2026
        </div>

        <h1 class="title">
            Good Night,<br>
            <span>Zahra.</span>
        </h1>

        <div class="line"></div>

        <div class="message">

            <span id="typing"></span>
            <span class="cursor"></span>

        </div>

        <div class="buttons">

            <button class="btn sleep" onclick="sleep()">
                okay, aku tidur ♡
            </button>

            <button class="btn no" id="noBtn" onclick="runAway()">
                belum mau
            </button>

        </div>

        <div class="letter" id="letter">

            <p>
                “yaudah satu pesan terakhir...
                jangan lupa istirahat ya 😭”
            </p>

            <small>
                sekarang beneran tidur.
            </small>

        </div>

    </section>

</main>

<!-- =========================
     ENDING
========================= -->

<div class="ending" id="ending">

    <div class="small">
        good night
    </div>

    <h2>Zahra ♡</h2>

    <p>
        sleep well & have a beautiful dream tonight.
    </p>

    <button class="close" onclick="closeEnding()">
        kembali
    </button>

</div>

<script>

/* =========================
   ENTER
========================= */

function enter(){

    document
        .getElementById("intro")
        .classList.add("hide");

    setTimeout(startTyping,900);

}


/* =========================
   TYPING
========================= */

const message =
"selamat malam, zahra. hari ini mungkin panjang, jadi sekarang waktunya istirahat. jangan mikirin yang berat-berat dulu. malam ini cukup rebahan, tutup mata, dan biarkan otak kamu libur sebentar. 😭";

let i = 0;

function startTyping(){

    const target =
        document.getElementById("typing");

    function type(){

        if(i < message.length){

            target.textContent +=
                message.charAt(i);

            i++;

            let speed = 28;

            if(
                message.charAt(i-1) === "." ||
                message.charAt(i-1) === ","
            ){
                speed = 180;
            }

            setTimeout(type,speed);
        }

    }

    type();

}


/* =========================
   SLEEP BUTTON
========================= */

function sleep(){

    const letter =
        document.getElementById("letter");

    letter.classList.add("opened");

    createPetals(18);

    setTimeout(()=>{

        document
            .getElementById("ending")
            .classList.add("show");

    },1800);

}


/* =========================
   RUN AWAY BUTTON
========================= */

function runAway(){

    const btn =
        document.getElementById("noBtn");

    const x =
        Math.random()*120 - 60;

    const y =
        Math.random()*80 - 40;

    btn.style.transform =
        `translate(${x}px,${y}px)`;

}


/* =========================
   PETALS
========================= */

function createPetal(){

    const petal =
        document.createElement("div");

    petal.className="petal";

    petal.style.left =
        Math.random()*100 + "vw";

    petal.style.animationDuration =
        5 + Math.random()*5 + "s";

    petal.style.opacity =
        .2 + Math.random()*.4;

    document.body.appendChild(petal);

    setTimeout(()=>{
        petal.remove();
    },10000);

}

function createPetals(amount){

    for(let i=0;i<amount;i++){

        setTimeout(()=>{
            createPetal();
        },i*120);

    }

}


/* =========================
   NORMAL PETALS
========================= */

setInterval(()=>{
    createPetal();
},2200);


/* =========================
   CLOSE ENDING
========================= */

function closeEnding(){

    document
        .getElementById("ending")
        .classList.remove("show");

}

</script>

</body>
</html>
